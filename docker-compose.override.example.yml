# Local overrides. Copy to `docker-compose.override.yml` and adjust to your
# machine. `docker-compose.override.yml` is gitignored, so your local settings
# (backend URL, model, host paths, tuning) stay out of the repo.
#
# `docker compose up` merges this file on top of docker-compose.yml
# automatically (no extra flags).
services:
  proxycache:
    volumes:
      # Mount the host --slot-save-path so the proxy can delete .bin files
      # directly (llama.cpp has no disk-delete endpoint).
      - /tmp/llama-slot:/bin_cache
    environment:
      - 'BACKENDS=[{"url": "http://host.docker.internal:9931", "n_slots": 4}]'
      - BIG_THRESHOLD_WORDS=500
      - LCP_TH=0.6
      - MODEL_ID=llama.cpp
      - BIN_CACHE_DIR=/bin_cache
      - BIN_CACHE_MAX_MB=10240
