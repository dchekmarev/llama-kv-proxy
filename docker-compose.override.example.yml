# Local overrides. Copy to `docker-compose.override.yml` and adjust to your
# machine. `docker-compose.override.yml` is gitignored, so your local settings
# (backend URL, model, host paths, tuning) stay out of the repo.
#
# `docker compose up` merges this file on top of docker-compose.yml
# automatically (no extra flags).
#
# After `docker compose up -d --build`, confirm it is up:
#   curl -s localhost:8080/proxy/health | python3 -m json.tool
# Every tunable (timeouts, cache caps, UI, logging) is an env var; the full
# reference is the README "Configuration" table (or .env.example).
services:
  llama-kv-proxy:
    volumes:
      # Mount the host --slot-save-path so the proxy can delete .bin files
      # directly (llama.cpp has no disk-delete endpoint).
      - /var/lib/llama-slots:/bin_cache
    environment:
      # n_slots is only a bootstrap hint, not functional: the proxy discovers
      # the real per-model slots via GET /slots?model=X. The router preset
      # uses slots=1 (no memory for more), so keep it at 1.
      - 'BACKENDS=[{"url": "http://host.docker.internal:9931", "n_slots": 1}]'
      - BIG_THRESHOLD_WORDS=500
      - LCP_TH=0.6
      - MODEL_ID=llama.cpp
      - BIN_CACHE_DIR=/bin_cache
      - BIN_CACHE_MAX_MB=10240
      # Reconcile meta/.bin drift (both directions) every 600s; 0 disables.
      - BIN_RECONCILE_INTERVAL_S=600
