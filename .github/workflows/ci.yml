name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: |
          python -m mypy app.py config.py slot_manager.py llama_client.py \
            hashing.py bin_cache.py metrics.py request_id.py version.py \
            llama_kv_proxy.py

      - name: Test (pytest)
        run: python -m pytest tests/ -q
