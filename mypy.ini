[mypy]
python_version = 3.11

# Check the bodies of functions even when they lack full annotations, so real
# type errors inside untyped functions are caught. (We do not yet require every
# function to be annotated -- that is a larger follow-up.)
check_untyped_defs = True

# Catch common footguns.
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
